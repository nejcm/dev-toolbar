name: Report bundle size
description: Write a per-entrypoint size table for the built package to the job summary.

# A single JS/CSS/total triple doesn't fit an 11-entry-point, code-split ESM
# build (see `scripts/bundle-size.mjs`), so the measurement lives in that
# script and this action is a thin reporting wrapper around it.
#
# Requires a build to have run and `actions/checkout` before it. Node is used
# rather than bun only because the script is plain ESM with no dependencies;
# either runtime works.

inputs:
  heading:
    description: Heading for the summary section.
    required: false
    default: Bundle size

runs:
  using: composite
  steps:
    - name: Report bundle size
      shell: bash
      # The heading goes through `env`, not interpolated into the script body:
      # `${{ }}` inside `run:` is textual substitution before bash sees it —
      # the shape every Actions script-injection advisory is about.
      env:
        HEADING: ${{ inputs.heading }}
      run: |
        {
          echo "## ${HEADING}"
          echo
          node scripts/bundle-size.mjs
        } >> "$GITHUB_STEP_SUMMARY"
