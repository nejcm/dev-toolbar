name: Knip check
description: Run knip and post a collapsible report to the job summary. Reports; does not gate.

# Adapted from rumi.ai's `.github/actions/knip-check`. Two changes: knip's own
# `markdown` reporter replaces the sed-based ANSI stripping and manual code
# fence, and the exit code is swallowed here rather than relying on the caller
# to set `continue-on-error`.
#
# This action reports, it does not gate — but knip *is* a gate: `bun run verify`
# runs `bun run knip`, so unused code fails CI in the `verify` step of the
# calling workflow, and fails identically on a contributor's machine. Keeping the gate
# there rather than here is what makes "if verify passes locally it passes in
# CI" true. This step exists for the readable report, and swallows the exit code
# so it still renders on a run `verify` has already failed — which is precisely
# the run where you want to see *which* export went unused. The cost of the
# duplication is one extra knip run of a second or two.
#
# Worth reporting rather than just failing: an 11-entry export map is exactly
# where a subpath quietly stops being referenced.
#
# Requires `actions/checkout` and an install before it.

runs:
  using: composite
  steps:
    - name: Knip check
      id: knip
      shell: bash
      run: |
        set +e
        bunx knip --no-config-hints --reporter markdown > knip-report.md 2>&1
        code=$?
        set -e
        cat knip-report.md
        # knip exits 1 when it finds issues and >1 on a real failure (bad
        # config, unreadable entry). Only the former is "found something".
        if [ "$code" -eq 0 ]; then
          echo "status=clean" >> "$GITHUB_OUTPUT"
        elif [ "$code" -eq 1 ]; then
          echo "status=issues" >> "$GITHUB_OUTPUT"
        else
          echo "status=error" >> "$GITHUB_OUTPUT"
        fi

    - name: Knip summary
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        {
          echo "## Knip"
          echo
          case "${{ steps.knip.outputs.status }}" in
            clean)  echo "No unused files, exports or dependencies." ;;
            issues) echo "Unused code reported. \`verify\` gates on this — see its step." ;;
            *)      echo "knip failed to run. The report below is its output." ;;
          esac
          echo
          echo "<details><summary>Full report</summary>"
          echo
          # The report is already markdown; it must not be fenced, and it needs
          # the blank lines above and below to render inside <details>.
          cat knip-report.md 2>/dev/null || echo "_no report produced_"
          echo
          echo "</details>"
          # Trailing blank line: without it a following step's `##` heading
          # lands on the line after the closing tag and does not render.
          echo
        } >> "$GITHUB_STEP_SUMMARY"
        rm -f knip-report.md
