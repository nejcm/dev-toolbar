name: Knip check
description: Run knip and post a collapsible report to the job summary. Reports; does not gate.

# Reports; does not gate — but knip *is* a gate via `bun run verify` (`bun run
# knip`), which fails identically in CI and on a contributor's machine.
# Keeping the gate there is what makes "passes locally -> passes in CI" true.
# This step exists for the readable report, and swallows knip's exit code so
# it still renders on a run `verify` already failed — precisely the run where
# you want to see which export went unused.
#
# Requires `actions/checkout` and an install before it.

runs:
  using: composite
  steps:
    - name: Knip check
      id: knip
      shell: bash
      run: |
        set +e
        bunx knip --no-config-hints --reporter markdown > knip-report.md 2>&1
        code=$?
        set -e
        cat knip-report.md
        # knip exits 1 when it finds issues, >1 on a real failure (bad config,
        # unreadable entry) — only the former means "found something".
        if [ "$code" -eq 0 ]; then
          echo "status=clean" >> "$GITHUB_OUTPUT"
        elif [ "$code" -eq 1 ]; then
          echo "status=issues" >> "$GITHUB_OUTPUT"
        else
          echo "status=error" >> "$GITHUB_OUTPUT"
        fi

    - name: Knip summary
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        {
          echo "## Knip"
          echo
          case "${{ steps.knip.outputs.status }}" in
            clean)  echo "No unused files, exports or dependencies." ;;
            issues) echo "Unused code reported. \`verify\` gates on this — see its step." ;;
            *)      echo "knip failed to run. The report below is its output." ;;
          esac
          echo
          echo "<details><summary>Full report</summary>"
          echo
          # Already markdown; must not be fenced, and needs the blank lines
          # around it to render inside <details>.
          cat knip-report.md 2>/dev/null || echo "_no report produced_"
          echo
          echo "</details>"
          # Trailing blank line, or a following step's `##` heading won't
          # render right after the closing tag.
          echo
        } >> "$GITHUB_STEP_SUMMARY"
        rm -f knip-report.md
