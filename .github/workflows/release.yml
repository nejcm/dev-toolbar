name: Release

# One workflow file, on purpose: npm's trusted publisher matches on the
# *entry-point* workflow's filename (docs.npmjs.com/trusted-publishers), so
# `npm publish` must live here in `release.yml` — this filename is what's
# registered on npmjs.com. Renaming it breaks publishing until the trusted
# publisher is reconfigured.

on:
  # Temporarily disabled — automatic trigger removed, manual dispatch only.
  # Restore `push: branches: [main]` to re-enable.
  workflow_dispatch: {}

# Least privilege at the top; each job widens only what it needs.
permissions:
  contents: read

# REQUIRED, not decoration: on `workflow_call`, `github.workflow`/`github.ref`
# resolve to the *caller's* values (see `ci.yml`), so the gate's CI run lands
# in this workflow's concurrency group, not CI's own. Without a group here,
# CI's `cancel-in-progress: true` default could cancel an in-flight release —
# possibly between "tag created" and "published to npm". Fixed group name
# (not keyed on `ref`) because there's only one release line: main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 1. Compute the version/changelog, groom the release PR, and — once it
  #    lands — tag it and create the GitHub release.
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags and GitHub releases, push the release branch
      pull-requests: write # open, update and label the release PR
    timeout-minutes: 10
    outputs:
      # Set to `true` only when a root-component release was actually created
      # (the action never sets it otherwise, so it resolves to ''). Not
      # `releases_created`, which the action always sets — to the *string*
      # "false" when nothing released, which GitHub does not treat as falsy,
      # so a bare `if:` on it would be truthy every push. Downstream jobs
      # compare against 'true' explicitly.
      release_created: ${{ steps.release.outputs.release_created }}
      # `vX.Y.Z`, only because `release-please-config.json` sets
      # `include-component-in-tag: false` — otherwise the `node` release type
      # would derive a component from the package name and tag
      # `dev-toolbar-vX.Y.Z`, missing the hand-pushed `v0.1.0` bootstrap tag.
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Third-party actions here are SHA-pinned the same way as `ci.yml`.
      #
      # Uses the default `GITHUB_TOKEN`, so the release PR release-please opens
      # does NOT trigger workflows and gets no CI of its own — that's why the
      # `gate` job below exists, as the only CI the release commit ever gets.
      # A PAT would fix that at the cost of a long-lived credential; not worth
      # it while `gate` covers it.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Manifest mode; `release-type` is set per-package in the config
          # file, not here.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 2. The release gate: run real CI against the release commit.
  #
  # `uses:` calls `ci.yml` as a reusable workflow — why `workflow_call` and its
  # `called` input exist there; do not remove them. `called` defaults to
  # `true`, so nothing needs passing here; it's what stops CI's
  # `chore(release):` skip from skipping the gate itself (on `workflow_call`
  # the `github` context belongs to the caller's push, which *is* the
  # `chore(release):` push).
  #
  # Conditional on `release_created` because `ci.yml`'s own `push` trigger
  # already runs on every main push except the `chore(release):` one it skips
  # by design — gating here makes the two exactly complementary. Unconditional,
  # every main-branch push would get CI twice.
  #
  # That complementarity depends on config, and it's the least obvious
  # coupling in this file: release-please's default title pattern fills
  # `${scope}` from the target branch, so out of the box the release commit
  # would be titled `chore(main): release ... X.Y.Z` — missing the
  # `chore(release):` marker `ci.yml` greps for, doubling CI on every release.
  # `pull-request-title-pattern`/`group-pull-request-title-pattern` in
  # `release-please-config.json` restore the marker (see CONTRIBUTING.md's
  # "Releasing" section for why both keys are needed). Change or remove them
  # and this job's premise silently stops holding.
  #
  # `publish` carries the identical condition and `needs: gate`, so a skipped
  # gate always means a skipped publish.
  gate:
    name: gate (CI on the release commit)
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # 3. Publish to npm via trusted publishing (OIDC). No token, anywhere.
  #
  # No GitHub Environment gate, deliberately: solo-maintainer repo, so
  # `prevent_self_review` would lock out the only maintainer, and without it
  # the "approval" is just a pause with an audit trail. The trusted publisher
  # config on npmjs.com already pins repo + workflow filename, which is the
  # one real protection an Environment would add — do not re-litigate without
  # a second maintainer. `npm stage publish` (needs npm >= 11.15.0), binding
  # the human check to the artifact instead of the job, is the upgrade worth
  # revisiting later.
  #
  # If this job (or `gate`) fails, the tag and GitHub release already exist —
  # release-please creates them first, so the repo ends up one version ahead
  # of npm. Recover with "Re-run failed jobs", never "Re-run all jobs"; see
  # CONTRIBUTING.md's "When a release is tagged but not published".
  publish:
    name: publish to npm
    needs: [release-please, gate]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for a publish credential, and that
      # Sigstore signs provenance with. NOT the authentication — that's the
      # trusted publisher on npmjs.com; without it this fails with E401/E404
      # regardless of permissions.
      id-token: write
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      # `.nvmrc` is the source of truth for Node, same convention as `ci.yml`.
      # Nothing here runs on Node directly — this step exists because trusted
      # publishing needs npm >= 11.5.1 and Node >= 22.14.0
      # (docs.npmjs.com/trusted-publishers), above the runner's preinstalled
      # npm. `package-manager-cache: false` since the bun cache step below owns
      # caching.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Load-bearing because Node comes from `.nvmrc`, which is owned by the
      # test environment, not publishing: a lower Node major would bring an
      # npm below the trusted-publishing floor and fail with an opaque
      # E401/E404. Assert here and repair in place, pinning an exact fallback
      # rather than `npm@latest` — an unpinned install would be an unreviewed
      # dependency in the step holding the publish credential. Dependabot does
      # not watch this fallback; it only matters if `.nvmrc` regresses.
      - name: Assert npm supports trusted publishing
        run: |
          required=11.5.1
          fallback=11.19.0
          current="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "npm $current is below the $required trusted-publishing floor; installing $fallback."
            npm install -g "npm@$fallback"
          fi
          npm --version

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `test:jest-consumer` lives here, not in the `gate` CI call, on purpose:
      # it verifies packaging — the CJS build's `module.require` fallback for
      # the optional `@testing-library/react` peer, which no ESM runner can
      # exercise — not correctness, which is why it's excluded from PR CI.
      # Running it here also tests the exact `dist/` this job is about to
      # pack, against the same checkout. Needs its own `npm ci` first since the
      # root script doesn't install the fixture; from a clean checkout it
      # otherwise fails with `jest: command not found`.
      - name: Install the jest-consumer fixture
        run: npm ci --prefix test/fixtures/jest-consumer

      - name: Verify the packaged CommonJS consumer
        run: bun run test:jest-consumer

      # Lifecycle scripts left on (no `--ignore-scripts`):
      # `npm publish` runs prepublishOnly -> prepack -> prepare -> pack
      # (docs.npmjs.com/cli/v11/using-npm/scripts). `prepublishOnly`
      # (`typecheck && build`) guarantees the tarball's `dist/` was built from
      # committed source at pack time rather than leftovers — duplicating ~15s
      # of the gate's work, but making the tarball self-evidently correct and
      # giving a manual emergency publish a safety net. `prepare`
      # (`simple-git-hooks`) is a harmless no-op here.
      #
      # No `--provenance`: trusted publishing attaches it automatically.
      # `--access public` is explicit even though `publishConfig.access`
      # already says so — not a place to depend on one file agreeing with
      # another. `npm`, never `bun publish`: bun supports neither OIDC nor
      # provenance, and silently ignores `publishConfig.provenance`
      # (oven-sh/bun#18611).
      - name: Publish to npm
        run: npm publish --access public
