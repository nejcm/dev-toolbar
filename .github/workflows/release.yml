name: Release

# npm's trusted publisher matches this file by name (docs.npmjs.com/trusted-publishers); renaming it breaks publishing until reconfigured on npmjs.com.

on:
  # Disabled: push trigger commented out, so merges to `main` no longer release/publish. Restore the `push` block to re-enable.
  # push:
  #   branches: [main]
  workflow_dispatch: {}

# Least privilege at the top; each job widens only what it needs.
permissions:
  contents: read

# `workflow_call` inherits the caller's `github.workflow`/`github.ref`, so the gate's CI run joins this group instead of CI's own — otherwise CI's cancel-in-progress could kill a release mid-publish. Fixed name, `cancel-in-progress: false`: rapid merges queue instead of cancelling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 1. Version + changelog: open the release PR, merge it, tag it.
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    # Covers only the `gh pr merge` step below; both release-please steps auth with secrets.GH_TOKEN instead.
    permissions:
      contents: write # push the release branch; merge the release PR
      pull-requests: write # the `gh pr merge` call below
    timeout-minutes: 10
    outputs:
      # Not `releases_created` — that's always set, to the *string* "false" (truthy). `tag` fires in steady state, `release` only if a release PR was merged by hand; unset outputs are '' so all fall back together.
      release_created: ${{ steps.tag.outputs.release_created || steps.release.outputs.release_created }}
      # `vX.Y.Z` via `include-component-in-tag: false`, or the `node` release type would tag `dev-toolbar-vX.Y.Z` and miss the hand-pushed `v0.1.0`.
      tag_name: ${{ steps.tag.outputs.tag_name || steps.release.outputs.tag_name }}
      version: ${{ steps.tag.outputs.version || steps.release.outputs.version }}
    steps:
      # Fail fast with a clear message: an unset secret is '', which silently overrides the action's github.token default with an empty credential.
      - name: Assert the release PAT is configured
        env:
          RELEASE_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Secret GH_TOKEN is unset. release-please needs a PAT with contents+pull-requests+workflows write; GITHUB_TOKEN cannot create a release whose tag spans .github/workflows/ changes."
            exit 1
          fi

      # SHA-pinned like ci.yml. Opens a short-lived PR just to carry the squash subject for the next step.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Must be the PAT: GitHub refuses releases whose tag spans .github/workflows/ under GITHUB_TOKEN (stalled v0.3.0).
          token: ${{ secrets.GH_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Gated on repo state (an open release PR exists), not on `prs_created` — that's only true when a PR was opened *this run*, so it'd skip an existing PR and strand it forever. Matches release-please's branch prefix (ci.yml keys off the same). Squash merge so the subject is `chore(release): release X.Y.Z (#N)`, parsed by the config's title patterns. Retries because GitHub computes mergeability async and can reject a too-early merge.
      - name: Merge the release PR
        id: merge
        env:
          # github.token, not the PAT — keeps the resulting release commit from re-triggering this workflow's push trigger. `GH_TOKEN` is just gh's env var name.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pr="$(gh pr list --base main --state open \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--")) | .number] | join(" ")')"

          if [ -z "$pr" ]; then
            echo "No open release PR; nothing to release."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$pr" in
            *\ *)
              echo "::error::Expected at most one open release PR, found: $pr"
              exit 1
              ;;
          esac

          for attempt in 1 2 3 4 5; do
            if gh pr merge "$pr" --squash --delete-branch; then
              echo "Merged release PR #$pr."
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Merge attempt $attempt for #$pr failed; retrying in 10s."
            sleep 10
          done
          echo "::error::Could not merge release PR #$pr after 5 attempts."
          exit 1

      # Tags the commit just merged and sets `release_created`. A separate step (not a re-trigger) because the merge above lands under GITHUB_TOKEN, which triggers no workflows.
      - name: Run release-please (tag the merged release)
        id: tag
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Must be the PAT: GitHub refuses releases whose tag spans .github/workflows/ under GITHUB_TOKEN (stalled v0.3.0).
          token: ${{ secrets.GH_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 2. The only CI the release commit gets — ci.yml skips it as both PR and push, so this is what verifies the version bump before it reaches npm. Relies on ci.yml's `workflow_call`/`called` input and the `chore(release):` marker (see CONTRIBUTING.md, "Releasing"); don't remove either.
  gate:
    name: gate (CI on the release commit)
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      # Load-bearing: without it CI checks out the pre-release commit (github.sha) and passes while claiming to have tested the release.
      ref: ${{ needs.release-please.outputs.tag_name }}

  # 3. Publish to npm via trusted publishing (OIDC). No token, anywhere.
  #
  # No GitHub Environment gate: solo-maintainer repo where `prevent_self_review` would lock out the only maintainer, and npmjs.com's trusted publisher already pins repo + filename. Revisit if a second maintainer joins, or via `npm stage publish` (npm >= 11.15.0).
  #
  # A failure here or in `gate` leaves the tag/release published but npm behind. Recover with "Re-run failed jobs", not "Re-run all jobs" — CONTRIBUTING.md, "When a release is tagged but not published".
  publish:
    name: publish to npm
    needs: [release-please, gate]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token for npm's publish credential and Sigstore provenance; auth itself is npmjs.com's trusted publisher config.
      id-token: write
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tag, not github.sha (predates the release commit) — else this packs and publishes the previous version. Observed: v0.4.0 tagged, tarball built as 0.3.0.
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      # Trusted publishing needs npm >= 11.5.1 / Node >= 22.14.0, above the runner's preinstalled npm; nothing here runs on Node directly.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Fallback is pinned (not npm@latest) since this step holds the publish credential; Dependabot doesn't watch it.
      - name: Assert npm supports trusted publishing
        run: |
          required=11.5.1
          fallback=11.19.0
          current="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "npm $current is below the $required trusted-publishing floor; installing $fallback."
            npm install -g "npm@$fallback"
          fi
          npm --version

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Lifecycle scripts stay on so prepublishOnly (typecheck && build) rebuilds dist/ at pack time, not from leftovers. No --provenance (trusted publishing attaches it); npm not `bun publish` — bun supports neither OIDC nor provenance (oven-sh/bun#18611).
      - name: Publish to npm
        run: npm publish --access public
