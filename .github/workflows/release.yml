name: Release

# npm's trusted publisher matches on the *entry-point* workflow's filename
# (docs.npmjs.com/trusted-publishers), so `npm publish` has to live in this
# file. Renaming it breaks publishing until npmjs.com is reconfigured.

on:
  # Every merge to `main` releases: bump, changelog, tag, npm. There is no
  # loop, on two counts — the release commit lands under `GITHUB_TOKEN`, which
  # triggers no workflows, and a run over it would find nothing releasable and
  # stop at `release-please` anyway.
  push:
    branches: [main]
  # Kept for re-running a release by hand — e.g. after a failed `publish`.
  workflow_dispatch: {}

# Least privilege at the top; each job widens only what it needs.
permissions:
  contents: read

# Load-bearing: on `workflow_call` `github.workflow`/`github.ref` are the
# *caller's*, so the gate's CI run lands in this group rather than CI's own.
# Without it, CI's `cancel-in-progress` could cancel a release between tagging
# and publishing. One release line, so a fixed name — and `cancel-in-progress:
# false` queues rapid merges to `main` instead of cancelling a release
# in flight; each queued run releases whatever is unreleased by its turn.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 1. Version + changelog: open the release PR, merge it, tag it.
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    # These cover the `gh pr merge` step, which deliberately stays on
    # `GITHUB_TOKEN`. Both `release-please` steps authenticate with
    # `secrets.GH_TOKEN` instead and are bounded by that PAT's own scopes, not
    # by this block.
    permissions:
      contents: write # push the release branch; merge the release PR
      pull-requests: write # the `gh pr merge` call below
    timeout-minutes: 10
    outputs:
      # `release_created`, not `releases_created`: the latter is always set —
      # to the *string* "false", which GitHub does not treat as falsy.
      #
      # `tag` releases in the steady state; `release` does so only if an
      # earlier release PR was merged by hand. Unset outputs are '', so all
      # three fall back together. If both release, `tag` wins and the older
      # tag is left tagged-but-unpublished (see CONTRIBUTING.md).
      release_created: ${{ steps.tag.outputs.release_created || steps.release.outputs.release_created }}
      # `vX.Y.Z` only because of `include-component-in-tag: false`; otherwise
      # the `node` release type tags `dev-toolbar-vX.Y.Z` and never finds the
      # hand-pushed `v0.1.0`.
      tag_name: ${{ steps.tag.outputs.tag_name || steps.release.outputs.tag_name }}
      version: ${{ steps.tag.outputs.version || steps.release.outputs.version }}
    steps:
      # Fail here rather than 40 lines later with an opaque 401/403. An unset
      # secret is '', and passing '' to the action's `token` input overrides
      # its `github.token` default with an empty credential.
      - name: Assert the release PAT is configured
        env:
          RELEASE_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Secret GH_TOKEN is unset. release-please needs a PAT with contents+pull-requests+workflows write; GITHUB_TOKEN cannot create a release whose tag spans .github/workflows/ changes."
            exit 1
          fi

      # SHA-pinned as in `ci.yml`. The PR this opens lives for one API round
      # trip (next step); it exists to carry the squash subject.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # NOT `github.token`. GitHub refuses `POST /repos/{o}/{r}/releases`
          # from `GITHUB_TOKEN` when the tag's commit range touches
          # `.github/workflows/`, with a bare "Resource not accessible by
          # integration" — which is what stalled v0.3.0. The PAT needs
          # contents, pull-requests and workflows write.
          token: ${{ secrets.GH_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # `prs_created` is a string, same trap as above. Squash so the subject
      # is `chore(release): release X.Y.Z (#N)` — what the config's title
      # patterns parse next. The retry is a real race: GitHub computes
      # mergeability asynchronously and rejects a merge made before it has a
      # verdict. PR number via env, never `${{ }}` into the script.
      - name: Merge the release PR
        id: merge
        if: steps.release.outputs.prs_created == 'true'
        env:
          # `github.token`, NOT the PAT, and unrelated to the secret that
          # happens to share this name — `GH_TOKEN` is just what the `gh` CLI
          # reads. Merging under `GITHUB_TOKEN` is what keeps the resulting
          # release commit from re-triggering this workflow (see the `push`
          # trigger above). The release PR touches no workflow files, so the
          # restriction that forces the PAT on the steps around it does not
          # apply here.
          GH_TOKEN: ${{ github.token }}
          # `|| '{}'` is load-bearing: step `env` is evaluated even when the
          # step's `if` is false, and `pr` is unset on every run that opens no
          # release PR. Bare `fromJSON('')` then aborts the whole job with
          # "Error reading JToken from JsonReader".
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR_NUMBER" --squash --delete-branch; then
              echo "Merged release PR #$PR_NUMBER."
              exit 0
            fi
            echo "Merge attempt $attempt for #$PR_NUMBER failed; retrying in 10s."
            sleep 10
          done
          echo "::error::Could not merge release PR #$PR_NUMBER after 5 attempts."
          exit 1

      # Tags the commit the merge just landed, and sets `release_created`. A
      # step rather than a second run of this workflow because the merge lands
      # under `GITHUB_TOKEN`, so the `push` trigger above never sees it. Opens
      # no new PR — nothing releasable is left.
      - name: Run release-please (tag the merged release)
        id: tag
        if: steps.merge.outcome == 'success'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # NOT `github.token`. GitHub refuses `POST /repos/{o}/{r}/releases`
          # from `GITHUB_TOKEN` when the tag's commit range touches
          # `.github/workflows/`, with a bare "Resource not accessible by
          # integration" — which is what stalled v0.3.0. The PAT needs
          # contents, pull-requests and workflows write.
          token: ${{ secrets.GH_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 2. The only CI the release commit gets: `ci.yml` skips it both as a PR and
  #    as a push, so without this the version bump and generated changelog
  #    reach npm unverified.
  #
  # `ci.yml`'s `workflow_call` and its `called` input exist for this; do not
  # remove them. `called` defaults to `true` and is what stops CI's
  # `chore(release):` skip from skipping the gate itself.
  #
  # The skips rest on the `chore(release):` marker, which
  # `release-please-config.json`'s two title patterns restore over
  # release-please's default `chore(main):` (CONTRIBUTING.md's "Releasing"
  # explains why both keys). Break them and only `ci.yml`'s branch-prefix
  # check still holds.
  gate:
    name: gate (CI on the release commit)
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # 3. Publish to npm via trusted publishing (OIDC). No token, anywhere.
  #
  # No GitHub Environment gate, deliberately: solo-maintainer repo, where
  # `prevent_self_review` locks out the only maintainer and without it the
  # approval is just a pause. npmjs.com's trusted publisher already pins repo
  # + filename, the one real protection an Environment adds — don't
  # re-litigate without a second maintainer. `npm stage publish` (npm >=
  # 11.15.0) is the upgrade worth revisiting.
  #
  # A failure here or in `gate` leaves the tag and GitHub release in place,
  # one version ahead of npm. Recover with "Re-run failed jobs", never
  # "Re-run all jobs" — CONTRIBUTING.md, "When a release is tagged but not
  # published".
  publish:
    name: publish to npm
    needs: [release-please, gate]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for a publish credential and
      # Sigstore signs provenance with. Not the authentication — that's the
      # trusted publisher on npmjs.com; without it, E401/E404 regardless.
      id-token: write
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      # Nothing here runs on Node directly; this step exists because trusted
      # publishing needs npm >= 11.5.1 and Node >= 22.14.0, above the runner's
      # preinstalled npm. The bun cache step below owns caching.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # `.nvmrc` is owned by the test environment, not publishing, so a Node
      # downgrade would drop npm below the floor and fail with an opaque
      # E401/E404. The fallback is pinned, not `npm@latest` — an unpinned
      # install in the step that holds the publish credential. Dependabot does
      # not watch it.
      - name: Assert npm supports trusted publishing
        run: |
          required=11.5.1
          fallback=11.19.0
          current="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "npm $current is below the $required trusted-publishing floor; installing $fallback."
            npm install -g "npm@$fallback"
          fi
          npm --version

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Here rather than in `gate` because it verifies packaging, not
      # correctness: the CJS build's `module.require` fallback for the optional
      # `@testing-library/react` peer, which no ESM runner can exercise. It
      # also tests the exact `dist/` this job packs. `npm ci` first — the root
      # script doesn't install the fixture, so `jest: command not found`.
      - name: Install the jest-consumer fixture
        run: npm ci --prefix test/fixtures/jest-consumer

      - name: Verify the packaged CommonJS consumer
        run: bun run test:jest-consumer

      # Lifecycle scripts left on so `prepublishOnly` (`typecheck && build`)
      # rebuilds `dist/` from committed source at pack time rather than
      # packing leftovers — ~15s duplicated from the gate, and the safety net
      # under a manual emergency publish.
      #
      # No `--provenance`: trusted publishing attaches it. `npm`, never `bun
      # publish` — bun supports neither OIDC nor provenance and silently
      # ignores `publishConfig.provenance` (oven-sh/bun#18611).
      - name: Publish to npm
        run: npm publish --access public
