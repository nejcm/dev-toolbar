name: Release

# npm's trusted publisher matches this file by name (docs.npmjs.com/trusted-publishers); renaming it breaks publishing until reconfigured on npmjs.com.

on:
  # Release-on-merge: every `feat:`/`fix:` that lands on `main` ships without anyone dispatching a run. Comment this block out again to go back to release-by-hand — the `workflow_dispatch` below keeps working either way, and the merge step's same-repo + `autorelease: pending` + `--match-head-commit` checks are what keep an unattended run from squashing a fork PR onto `main`.
  push:
    branches: [main]
  workflow_dispatch: {}

# Least privilege at the top; each job widens only what it needs.
permissions:
  contents: read

# `workflow_call` inherits the caller's `github.workflow`/`github.ref`, so the gate's CI run joins this group instead of CI's own — otherwise CI's cancel-in-progress could kill a release mid-publish. Fixed name, `cancel-in-progress: false`: rapid merges queue instead of cancelling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 1. Version + changelog: open the release PR, merge it, tag it.
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    # Covers only the `gh pr merge` step below; both release-please steps auth with secrets.GH_TOKEN instead.
    permissions:
      contents: write # push the release branch; merge the release PR
      pull-requests: write # the `gh pr merge` call below
    timeout-minutes: 10
    outputs:
      # Not `releases_created` — that's always set, to the *string* "false" (truthy). `tag` fires in steady state, `release` only if a release PR was merged by hand; unset outputs are '' so all fall back together.
      release_created: ${{ steps.tag.outputs.release_created || steps.release.outputs.release_created }}
      # `vX.Y.Z` via `include-component-in-tag: false`, or the `node` release type would tag `dev-toolbar-vX.Y.Z` and miss the existing plain `vX.Y.Z` tags.
      tag_name: ${{ steps.tag.outputs.tag_name || steps.release.outputs.tag_name }}
      version: ${{ steps.tag.outputs.version || steps.release.outputs.version }}
    steps:
      # Fail fast with a clear message: an unset secret is '', which silently overrides the action's github.token default with an empty credential.
      - name: Assert the release PAT is configured
        env:
          RELEASE_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Secret GH_TOKEN is unset. release-please needs a PAT with contents+pull-requests+workflows write; GITHUB_TOKEN cannot create a release whose tag spans .github/workflows/ changes."
            exit 1
          fi

      # SHA-pinned like ci.yml. Opens a short-lived PR just to carry the squash subject for the next step.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Must be the PAT: GitHub refuses releases whose tag spans .github/workflows/ under GITHUB_TOKEN (stalled v0.3.0).
          token: ${{ secrets.GH_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Gated on repo state (an open release PR exists), not on `prs_created` — that's only true when a PR was opened *this run*, so it'd skip an existing PR and strand it forever. Squash merge so the subject is `chore(release): release X.Y.Z (#N)`, parsed by the config's title patterns. Retries because GitHub computes mergeability async and can reject a too-early merge.
      #
      # The branch prefix alone does NOT authorise the merge. Anyone can open a fork PR on a branch named `release-please--x`, and ci.yml skips that prefix, so prefix-only selection would squash unreviewed, un-CI'd code onto `main` under a write token whenever a dispatch found no real release PR. Three checks close that: `isCrossRepository` (release-please pushes its branch to this repo, never a fork), the `autorelease: pending` label (applied by the PAT, and a fork author cannot label a PR), and `--match-head-commit`, so a push racing the merge aborts instead of landing unseen. All three are load-bearing now that the `push` trigger is live — with no human dispatching, they are the only thing between a fork branch and `main`. The label is release-please's default; do not set a custom `label` in release-please-config.json without changing the filter here, or the selection matches nothing and every release becomes a green no-op (hence the warning below).
      - name: Merge the release PR
        id: merge
        env:
          # github.token, not the PAT — keeps the resulting release commit from re-triggering this workflow's push trigger. `GH_TOKEN` is just gh's env var name.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          candidates="$(gh pr list --base main --state open \
            --json number,headRefName,headRefOid,isCrossRepository,labels \
            --jq '[.[]
                   | select(.isCrossRepository == false)
                   | select(.headRefName | startswith("release-please--"))
                   | select([.labels[].name] | index("autorelease: pending"))
                   | "\(.number) \(.headRefOid)"]
                  | join(", ")')"

          if [ -z "$candidates" ]; then
            # Distinguish "nothing to release" from "the checks above rejected the PR" — otherwise a
            # renamed release-please label (or a genuinely foreign PR) reads as a quiet no-op release.
            rejected="$(gh pr list --base main --state open --json number,headRefName \
              --jq '[.[] | select(.headRefName | startswith("release-please--")) | .number] | join(" ")')"
            if [ -n "$rejected" ]; then
              echo "::warning::Release-branch PR(s) $rejected did not pass the same-repo + \`autorelease: pending\` checks and were ignored."
            fi
            echo "No open release PR; nothing to release."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$candidates" in
            *,*)
              echo "::error::Expected at most one open release PR, found: $candidates"
              exit 1
              ;;
          esac
          pr="${candidates%% *}"
          head_sha="${candidates##* }"

          for attempt in 1 2 3 4 5; do
            if gh pr merge "$pr" --squash --delete-branch --match-head-commit "$head_sha"; then
              echo "Merged release PR #$pr."
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Merge attempt $attempt for #$pr failed; retrying in 10s."
            sleep 10
          done
          echo "::error::Could not merge release PR #$pr after 5 attempts."
          exit 1

      # Tags the commit just merged and sets `release_created`. A separate step (not a re-trigger) because the merge above lands under GITHUB_TOKEN, which triggers no workflows.
      - name: Run release-please (tag the merged release)
        id: tag
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Must be the PAT: GitHub refuses releases whose tag spans .github/workflows/ under GITHUB_TOKEN (stalled v0.3.0).
          token: ${{ secrets.GH_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 2. The only CI the release commit gets — ci.yml skips it as a PR and has no push trigger, so this is what verifies the version bump before it reaches npm. Relies on ci.yml's `workflow_call` and the `chore(release):` marker (see CONTRIBUTING.md, "Releasing"); don't remove either.
  #
  # It runs the *whole* of CI, and that is deliberate even though a release commit touches only package.json, CHANGELOG.md and .release-please-manifest.json — `src/` is byte-identical to a commit CI already passed, so `unit` and `browser` re-prove nothing about the diff. Two things keep them here anyway:
  #  - This repository is private on a plan without branch protection, so `main` accepts a direct push, and the `chore(release):` title marker lets a PR opt out of CI by name. Neither path is hypothetical enough to make this the one gate that trusts `main` was already verified.
  #  - Since ci.yml split into parallel lanes the gate finishes in about the time its slowest lane takes, not the sum — the cost that would have justified trimming it is mostly gone.
  # If that first point ever stops being true (branch protection, required checks), skipping `unit` and `browser` here is the obvious saving.
  gate:
    name: gate (CI on the release commit)
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      # Load-bearing: without it CI checks out the pre-release commit (github.sha) and passes while claiming to have tested the release.
      ref: ${{ needs.release-please.outputs.tag_name }}

  # 3. Publish to npm via trusted publishing (OIDC). No token, anywhere.
  #
  # No GitHub Environment gate: solo-maintainer repo where `prevent_self_review` would lock out the only maintainer, and npmjs.com's trusted publisher already pins repo + filename. Revisit if a second maintainer joins, or via `npm stage publish` (npm >= 11.15.0).
  #
  # A failure here or in `gate` leaves the tag/release published but npm behind. Recover with "Re-run failed jobs", not "Re-run all jobs" — CONTRIBUTING.md, "When a release is tagged but not published".
  publish:
    name: publish to npm
    needs: [release-please, gate]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token that is npm's publish credential; auth itself is npmjs.com's trusted publisher config. No provenance is produced: npm attests only a public source repository, and this one is private.
      id-token: write
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tag, not github.sha (predates the release commit) — else this packs and publishes the previous version. Observed: v0.4.0 tagged, tarball built as 0.3.0.
          ref: ${{ needs.release-please.outputs.tag_name }}
          # This job holds `id-token: write`. Nothing here talks to git after the fetch, so the checkout token has no reason to stay in `.git/config` next to the credential that can publish.
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      # Trusted publishing needs npm >= 11.5.1 / Node >= 22.14.0, above the runner's preinstalled npm; nothing here runs on Node directly.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Fallback is pinned (not npm@latest) since this step holds the publish credential; Dependabot doesn't watch it.
      - name: Assert npm supports trusted publishing
        run: |
          required=11.5.1
          fallback=11.19.0
          current="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "npm $current is below the $required trusted-publishing floor; installing $fallback."
            npm install -g "npm@$fallback"
          fi
          npm --version

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # `--ignore-scripts`, unlike everywhere else: this is the one job that can mint npm's publish credential, and a dependency `postinstall` runs before any code in this repository does. Verified that the tree still builds from a clean `--ignore-scripts` install. (The same threat is why ci.yml's `package` lane, not this job, runs the jest-consumer test.) Not closed: `prepublishOnly` below still runs tsup and tsc from `node_modules` here — that needs packing in `gate` and publishing the artifact instead.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Lifecycle scripts stay on so prepublishOnly (typecheck && build) rebuilds dist/ at pack time, not from leftovers. No --provenance: provenance needs a public source repo, so nothing here is attested and the flag would not change that (see CONTRIBUTING, "How the first publish happened"). npm not `bun publish` — bun supports no OIDC (oven-sh/bun#18611).
      - name: Publish to npm
        run: npm publish --access public
