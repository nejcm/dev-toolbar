name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  # Deployment is driven by release.yml, which calls this after its release-please job on every `main`
  # push. The landing page imports package metadata, so a push that cuts a release must publish the
  # release commit (the version bump), not the push that started the run — and exactly once. Two separate
  # triggers here (`push` for the merge, `release: published` for the bump) deployed twice per release and
  # cancelled each other through the `pages` group below; one caller that knows which commit is current
  # deploys once. It also keeps every deploy on `refs/heads/main`, so the `github-pages` environment's
  # deployment branch policy no longer needs the `v*` tag entry the old release trigger required.
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit-ish to build and deploy. release.yml passes the release tag when it cut one; checkout
          otherwise defaults to the caller's `github.sha`, one commit behind the bump. Empty deploys the
          triggering ref.
        type: string
        required: false
        default: ""
  # Manual redeploy of `main`, e.g. after a Pages outage.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # PR verification and deployment share one workflow while keeping Pages permissions deploy-only.
  build:
    name: build docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up job
        uses: ./.github/actions/setup-job

      # VitePress config is outside the root tsconfig; formatting, linting and the docs build cover it.
      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Verify docs
        run: bun run verify:docs

  deploy:
    name: deploy docs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Every caller runs on `main` (see the `workflow_call` note above), so the environment's deployment
    # branch policy only has to allow `main`.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      # Only the newest main revision should reach Pages; stale deployments are safe to cancel.
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up job
        uses: ./.github/actions/setup-job

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build docs
        run: bun run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
