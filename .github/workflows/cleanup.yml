name: Cleanup

# Actions caches are scoped to the ref that wrote them, and a merged/closed
# PR's ref is never built again — its entries just sit in the repo's cache
# budget until evicted, and eviction is LRU across the whole repo, so dead PR
# caches can evict live `main` entries. Deleting them on close is the fix.
#
# Uses native `gh cache` (since gh 2.32) rather than the archived
# `actions/gh-actions-cache` extension, whose install pulls an unpinned
# release binary at run time in a job holding `actions: write` — the exact
# thing the SHA-pinning convention in `ci.yml` exists to prevent.
#
# No `actions/checkout`: nothing here reads the tree, and `gh -R` doesn't need
# one.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: >-
          PR number whose caches to delete. Required on a manual run — the
          `pull_request` payload that normally supplies it is absent, and
          without it the ref resolves to `refs/pull//merge`, which matches
          nothing and reports success having deleted nothing.
        type: string
        required: true

# `actions: write` is what deleting a cache needs, and it's the only
# permission used — no checkout, so `contents` stays at none.
permissions:
  actions: write

jobs:
  caches:
    name: Delete the PR's Actions caches
    runs-on: ubuntu-latest
    # A `pull_request` event from a fork gets a read-only `GITHUB_TOKEN`
    # regardless of the `permissions` block above, so the delete would 403 on
    # every closed fork PR without this guard.
    #
    # Cost: a fork PR's caches still land under `refs/pull/N/merge` and age out
    # by LRU instead of being reclaimed on close; recover with a manual
    # `workflow_dispatch` and the PR number. `pull_request_target` would avoid
    # that but runs base-repo code with fork context — a worse trade for a
    # cache-hygiene job.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - name: Delete caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # The ref CI runs on for a pull_request event, so it's what every
          # cache this PR wrote is keyed to.
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
        run: |
          # `pr-number` is free-form on workflow_dispatch; unvalidated, a typo
          # builds a ref matching nothing and the run goes green having done
          # nothing.
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pr-number must be a positive integer, got '$PR_NUMBER'"
            exit 1
          fi

          ref="refs/pull/${PR_NUMBER}/merge"
          echo "Deleting all caches for $ref"

          # --succeed-on-no-caches: without it, a PR that never wrote a cache
          # exits non-zero instead of succeeding.
          gh cache delete --all --ref "$ref" --succeed-on-no-caches -R "$REPO"
