name: PR title

# PRs are squash-merged, and GitHub composes the squash subject from the *PR
# title*, not any branch commit. `release.yml`'s release-please reads that
# subject to compute the version bump and write `CHANGELOG.md`, so an
# unclassifiable title (e.g. "fixes") means no bump and no changelog entry.
# The `commit-msg` hook only ever sees branch commits, which squash discards —
# this workflow is the only check on the message that actually ships.
#
# Deliberately does NOT skip drafts (unlike `ci.yml`, which skips because
# `verify` is minutes of compute — this is one cheap `bunx` call, and a draft
# is exactly where a placeholder title lives) and does NOT exempt release PRs
# (their generated title is already a valid conventional commit, and they get
# no CI trigger anyway since release-please opens them with the default
# `GITHUB_TOKEN`).

on:
  # No `branches:` filter, same reason as `ci.yml` (filters on base branch,
  # silently matching nothing for stacked PRs).
  #
  # `types:` adds `edited` — the event that fires when someone fixes the
  # title, without which a red check would stay red forever. It also fires on
  # body/base edits, so the job must not gate on the title having changed (a
  # skipped job reports green, which would clear a red title check on a
  # body-only edit). `ready_for_review` is unneeded: unlike `ci.yml`, this
  # workflow never skips drafts, so the head SHA already has a title check by
  # the time a PR is marked ready.
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read # checkout only; the title arrives in the event payload

# Keyed on the PR, not `github.ref`, so repeated retitling leaves only the
# last run standing. Safe to cancel — nothing here has effects outside its own
# run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-title:
    name: lint title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # SHA-pinned with the resolved version in a trailing comment; see the
      # longer note in `ci.yml`.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Costs more than a dedicated title-lint action, but applies the exact
      # `.commitlintrc.json` rules the `commit-msg` hook uses — no second rule
      # set to keep in sync.
      - name: Set up job
        uses: ./.github/actions/setup-job

      - name: Lint the PR title as a conventional commit
        # The title goes through the environment, never interpolated into the
        # script: a `${{ }}` expansion is substituted before bash parses it, so
        # backticks or `$(...)` in the title would execute on the runner. The
        # PR number is included too, because GitHub appends ` (#<number>)` to
        # the title when composing the squash commit, and that counts against
        # `header-max-length` — linting the bare title would miss it.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          subject=$(printf '%s (#%s)' "$PR_TITLE" "$PR_NUMBER")
          printf 'Subject: %s\n' "$subject"
          if ! printf '%s\n' "$subject" | bunx commitlint; then
            {
              echo "## PR title is not a Conventional Commit"
              echo
              # Tilde fence + `printf` (not `echo`) so a title with backticks
              # or exactly `-n`/`-e` doesn't break the block.
              echo '~~~'
              printf '%s\n' "$PR_TITLE"
              echo '~~~'
              echo
              echo "This PR will be squash-merged, and the title above — plus"
              echo "the \` (#${PR_NUMBER})\` GitHub appends to it — becomes the"
              echo "commit message on \`main\`, the one release-please reads to"
              echo "decide the version bump and write the changelog. Edit the"
              echo "title and this check re-runs on its own."
              echo
              echo "See the commit convention in \`CONTRIBUTING.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
