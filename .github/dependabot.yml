version: 2

# `cooldown` is Dependabot's twin of `minimumReleaseAge` in bunfig.toml: never
# propose a day-zero version that `bun install --frozen-lockfile` would then
# install verbatim in CI. `default-days: 2` matches the 172800s there.
#
# Only minor/patch are grouped — majors arrive as their own PR, reviewable and
# revertable on their own, since a major bump of a build/lint tool is a
# decision for a published library.
updates:
  # `bun` is its own ecosystem id and covers `bun.lock`; npm/yarn/pnpm all
  # collapse into `npm`, which would NOT pick this repo up.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # This entry is what keeps the workflow SHA pins current — remove it and CI
  # re-freezes on whatever SHAs were last written by hand.
  #
  # `directories`, not `directory`: with `directory: "/"` alone, Dependabot
  # only scans `.github/workflows/` and a root `action.yml`, missing the pins
  # inside `.github/actions/*/action.yml` (setup-job alone holds three).
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # `bun`, matching the root entry above: the fixture installs with bun and is
  # locked by `bun.lock`. It was `npm` while it carried a `package-lock.json`;
  # left that way, this entry would find no manifest it understands.
  - package-ecosystem: bun
    directory: "/test/fixtures/jest-consumer"
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
